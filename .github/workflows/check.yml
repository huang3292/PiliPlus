name: Check

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "**.md"
  push:
    paths-ignore:
      - "**.md"

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 Linux

      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos > analyze_raw.log 2>&1
          status=$?
          sed -e 's/\x1b\[[0-9;]*m//g' analyze_raw.log > analyze.log
          if grep -aq 'flutter analyze' analyze.log; then
            echo '=== analyze output (flutter version) ==='
            grep -a 'flutter analyze' analyze.log
          fi
          if [ $status -eq 0 ]; then
            echo "analyze clean"
            exit 0
          fi
          if grep -aq ' • ' analyze.log; then
            grep -a ' • ' analyze.log \
              | head -40 \
              | sed -e 's/%/%25/g' \
              | while IFS= read -r line; do
                  echo "::error::${line}"
                done
          else
            echo "::error::analyze failed but no findings were parsed, see log"
            echo '=== tail of analyze.log ==='
            tail -40 analyze.log
          fi
          exit 1

      - name: Test filter rules
        run: flutter test test/utils/filter

      # 全仓库用例里可能混有历史遗留的失败，先放行，但把失败行写成注解暴露出来。
      - name: Test everything
        continue-on-error: true
        run: |
          set -o pipefail
          if flutter test 2>&1 | tee test_output.log; then
            echo "all tests passed"
          else
            grep -E '\[E\]|Expected: |Actual: |Failed to load|Exception' test_output.log \
              | head -30 \
              | sed -e 's/%/%25/g' -e 's/:/%3A/g' \
              | while IFS= read -r line; do
                  echo "::error::${line}"
                done
            exit 1
          fi
