name: Check

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "**.md"
  push:
    paths-ignore:
      - "**.md"

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 Linux

      # 作业日志需要登录才能看，这里把分析结果逐行写成注解，用公开 API 就能读到。
      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos > analyze_raw.log 2>&1
          status=$?
          sed -e 's/\x1b\[[0-9;]*m//g' analyze_raw.log > analyze.log
          grep -aE '(^|  )(error|warning)( • | - )' analyze.log \
            | head -40 | cut -c1-500 | sed -e 's/%/%25/g' \
            | while IFS= read -r line; do echo "::error::${line}"; done
          if [ "$status" -ne 0 ] && ! grep -qaE '(^|  )(error|warning)( • | - )' analyze.log; then
            echo "::error::analyze exited $status without parseable findings, tail below"
            tail -25 analyze.log | cut -c1-500 | sed -e 's/%/%25/g' | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit $status

      # cnativeapi 的 native-asset hook 在编译测试期需要 GTK/X11 头文件，runner 默认没装，
      # 缺了它 flutter test 一条用例都不会跑。
      - name: Install GTK dev headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            pkg-config libgtk-3-dev libx11-dev libxi-dev

      - name: Test filter rules
        run: |
          set +e
          flutter test test/utils/filter > unit_raw.log 2>&1
          status=$?
          # 进度输出靠 \r 分隔，不换成换行符的话整段会算作一行，注解会被 GitHub 丢掉。
          tr '\r' '\n' < unit_raw.log | sed -e 's/\x1b\[[0-9;]*m//g' > unit.log
          if [ "$status" -ne 0 ]; then
            echo "::error::flutter test exit=$status bytes=$(wc -c <unit.log) lines=$(wc -l <unit.log)"
            grep -aE '\[E\]|Expected:|Actual:|Which:|Error:|Failed to load' unit.log \
              | head -10 | cut -c1-300 | sed -e 's/%/%25/g' \
              | while IFS= read -r line; do echo "::error::HIT | ${line}"; done
            tail -20 unit.log | cut -c1-300 | sed -e 's/%/%25/g' \
              | while IFS= read -r line; do echo "::error::OUT | ${line}"; done
          fi
          exit $status

      # 全仓库用例里可能混有历史遗留的失败，先放行，但把失败行写成注解暴露出来。
      - name: Test everything
        continue-on-error: true
        run: |
          set +e
          flutter test > full_raw.log 2>&1
          status=$?
          tr '\r' '\n' < full_raw.log | sed -e 's/\x1b\[[0-9;]*m//g' > full.log
          if [ "$status" -ne 0 ]; then
            grep -aE '\[E\]|Error:|Failed to load|Some tests failed' full.log \
              | tail -20 | cut -c1-500 | sed -e 's/%/%25/g' \
              | while IFS= read -r line; do echo "::warning::${line}"; done
          fi
          exit 0
